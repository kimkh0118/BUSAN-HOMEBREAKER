<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주소별 건물 정보 찾기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f5f6f8;color:#333;padding:40px 20px}
.container{max-width:800px;margin:0 auto}
h1{font-size:24px;margin-bottom:24px}
.search-box{display:flex;gap:12px;margin-bottom:24px}
input[type=text]{flex:1;padding:14px 16px;font-size:16px;border:1px solid #ccc;border-radius:8px;outline:none}
input[type=text]:focus{border-color:#007bff}
button{padding:14px 28px;font-size:16px;font-weight:bold;color:#fff;background:#007bff;border:0;border-radius:8px;cursor:pointer;white-space:nowrap}
button:hover{background:#0056b3}
.result-list{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:12px;padding:24px;border:1px solid #e1e4e8}
.card-title{font-size:20px;font-weight:bold;margin-bottom:12px}
.card-info{font-size:14px;color:#555;line-height:1.7}
.card-info span{font-weight:600;color:#333}
.divider{height:1px;background:#eee;margin:16px 0}
.section-title{font-size:15px;font-weight:bold;margin-bottom:8px}
.summary{font-size:14px;line-height:1.8;margin-bottom:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}
th{background:#f8f9fa;font-weight:600}
td.num{text-align:right}
details{margin-top:4px}
summary{cursor:pointer;font-size:13px;color:#007bff;margin-bottom:8px}
.market{margin-top:16px;padding:16px 18px;background:#f0f7ff;border-left:4px solid #007bff;border-radius:8px;font-size:14px}
.market h3{font-size:15px;margin-bottom:8px}
.est{line-height:1.8}
.est b{font-size:17px}
.note{margin-top:8px;font-size:12px;color:#666;line-height:1.5}
.error-msg{padding:20px;background:#fff3f3;border:1px solid #ffcdd2;border-radius:8px;color:#d32f2f;font-size:15px}
.error-msg.small{margin-top:8px;padding:10px;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <h1>🏢 주소별 건물 정보 찾기</h1>
  <div class="search-box">
    <input type="text" id="addressInput" placeholder="주소를 입력하세요 (예: 부산시 수영구 장대골로 31번길 19)">
    <button id="searchBtn">건물 찾기</button>
  </div>
  <div id="resultContainer" class="result-list"></div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 2});
const fmtMan = m => {  // 만원 → "x억 y,yyy만원"
  m = Math.round(m); const eok = Math.floor(m / 10000), rest = m % 10000;
  return (eok ? eok + '억 ' : '') + (rest || !eok ? rest.toLocaleString() + '만원' : '').trim();
};
const fmtDate = d => /^\d{8}$/.test(d) ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}` : (d || '-');

function buildingTable(list) {
  const rows = list.map(b => `
    <tr>
      <td>${esc(b.dongNm || b.bldNm || '-')}</td>
      <td>${esc(b.mainPurpsCdNm)}</td>
      <td>${esc(b.strctCdNm)}</td>
      <td class="num">${num(b.totAreaM2)} ㎡ (${num(b.totAreaPy)}평)</td>
      <td class="num">지상 ${esc(b.grndFlrCnt)}${Number(b.ugrndFlrCnt) ? ' / 지하 ' + esc(b.ugrndFlrCnt) : ''}층</td>
      <td>${fmtDate(b.useAprDay)}</td>
    </tr>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>동</th><th>주용도</th><th>구조</th><th>연면적</th><th>층수</th><th>사용승인일</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function marketBlock(mk) {
  if (!mk) return '';
  if (mk.error) {
    return `<div class="error-msg small">⚠️ 시세 조회 실패: ${esc(mk.error)}<br>
      공공데이터포털에서 '단독/다가구 매매 실거래가' 활용신청이 승인됐는지 확인하세요.</div>`;
  }
  const e = mk.estimate || {};
  let html = `<div class="market"><h3>💰 인근 실거래 기반 참고 시세 <small>(${esc(mk.dong)} · 최근 ${mk.months}개월 · ${mk.count}건)</small></h3>`;
  const line = (label, x) => `<div class="est">${label}: <b>${fmtMan(x.mid)}</b>
      <small>(${fmtMan(x.low)} ~ ${fmtMan(x.high)} · 거래 ${x.n}건 · ㎡당 ${num(x.unitMid)}만원)</small></div>`;
  if (e.byLand) html += line('대지면적 기준', e.byLand);
  if (e.byFloor) html += line('연면적 기준', e.byFloor);
  if (!e.byLand && !e.byFloor) html += `<div class="est">비교할 거래가 부족해 시세를 추정하지 못했습니다. (최소 3건 필요)</div>`;
  html += `<div class="note">같은 동의 단독/다가구 신고 거래의 ㎡당 가격 중앙값(범위는 25~75%)에 이 건물 면적을 곱한 값입니다.
    입지·상태·도로 조건은 반영되지 않은 참고용 추정입니다.</div></div>`;

  if (mk.recent?.length) {
    html += `<details style="margin-top:12px"><summary>최근 거래 ${mk.recent.length}건 보기</summary><div class="table-wrap"><table>
      <thead><tr><th>계약일</th><th>지번</th><th>유형</th><th>거래금액</th><th>대지</th><th>연면적</th><th>건축년도</th></tr></thead><tbody>` +
      mk.recent.map(t => `<tr><td>${esc(t.date)}</td><td>${esc(t.jibun)}</td><td>${esc(t.houseType)}</td>
        <td class="num">${fmtMan(t.amount)}</td><td class="num">${num(t.platM2)}㎡</td><td class="num">${num(t.totM2)}㎡</td><td>${esc(t.buildYear)}</td></tr>`).join('') +
      `</tbody></table></div></details>`;
  }
  return html;
}

function renderCard(item) {
  const bs = item.buildings || [];
  let html = `
    <div class="card">
      <div class="card-title">🏢 ${esc(item.displayTitle || item.roadAddr)}</div>
      <div class="card-info">
        <div><span>도로명:</span> ${esc(item.roadAddr || '-')}</div>
        <div><span>지번:</span> ${esc(item.jibunAddr || '-')}</div>
        <div><span>건물관리번호:</span> ${esc(item.bdMgtSn || '-')}</div>
      </div>
      <div class="divider"></div>`;

  if (bs.length) {
    html += `<div class="section-title">[건축물대장 정보]</div>
      <div class="summary">
        <div>• 대지면적: ${num(item.platAreaM2)} ㎡ (${num(item.platAreaPy)}평)</div>
        <div>• 총 ${bs.length}개 동 · 연면적 합계 ${num(item.totalAreaM2)} ㎡</div>
      </div>`;
    html += bs.length > 3
      ? `<details><summary>동별 상세 보기 (${bs.length}개)</summary>${buildingTable(bs)}</details>`
      : buildingTable(bs);
  } else {
    html += `<div class="error-msg small">⚠️ 건축물대장 정보가 없습니다.</div>`;
  }

  html += marketBlock(item.market);
  return html + `</div>`;
}

async function searchBuilding() {
  const address = document.getElementById('addressInput').value.trim();
  const box = document.getElementById('resultContainer');
  if (!address) { alert('주소를 입력해 주세요.'); return; }

  box.innerHTML = '<div style="text-align:center;padding:40px;color:#666">조회 중입니다...</div>';
  try {
    const res = await fetch(`/api/search-building?address=${encodeURIComponent(address)}`);
    const result = await res.json();
    if (result.status !== 'success' || !result.data?.length) {
      box.innerHTML = `<div class="error-msg">⚠️ ${esc(result.message || result.detail || '검색 결과가 없습니다.')}</div>`;
      return;
    }
    box.innerHTML = result.data.map(renderCard).join('');
  } catch (e) {
    console.error(e);
    box.innerHTML = `<div class="error-msg">⚠️ 서버와 통신 중 에러가 발생했습니다.</div>`;
  }
}

document.getElementById('searchBtn').addEventListener('click', searchBuilding);
document.getElementById('addressInput').addEventListener('keyup', e => { if (e.key === 'Enter') searchBuilding(); });
</script>
</body>
</html>
